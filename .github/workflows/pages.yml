name: Refresh data and publish

on:
  push:
    branches: [main]
  schedule:
    # 05:00 UTC every day - job boards update overnight
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # 1. Pull fresh numbers from BLS, O*NET, USAJOBS and the state boards
  #
  # The data files are not in the repository. They are downloaded here,
  # every time, and handed to the build as an artifact - nothing is ever
  # committed, so nobody ever has to merge them.
  # ------------------------------------------------------------------
  data:
    name: Refresh the data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Restore the last run's data
        # The pipeline keeps the numbers from the last run when a source
        # breaks, so it needs the previous files. They are cached, not
        # committed.
        uses: actions/cache@v4
        with:
          path: src/data/generated
          key: data-${{ github.run_id }}
          restore-keys: |
            data-

      - name: Cache the BLS downloads
        # The file names carry the year (oesm25st.zip), so a new year means
        # a new file and a new download. Nothing goes stale.
        uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: bls-${{ github.run_id }}
          restore-keys: |
            bls-

      - name: Run the data pipeline
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          BLS_CONTACT_EMAIL: ${{ secrets.BLS_CONTACT_EMAIL }}
          CAREERONESTOP_USER_ID: ${{ secrets.CAREERONESTOP_USER_ID }}
          CAREERONESTOP_TOKEN: ${{ secrets.CAREERONESTOP_TOKEN }}
        run: |
          python3 -u -m pipeline.build_data

      - name: Check the data files
        # A broken file used to fail the build with a confusing error.
        # This says it plainly.
        run: |
          python3 - <<'PY'
          import glob, json, sys
          files = sorted(glob.glob('src/data/generated/*.json'))
          if not files:
              print("No data files were downloaded - the pipeline did not run.")
              sys.exit(1)
          bad = []
          for path in files:
              try:
                  json.load(open(path, encoding='utf-8'))
              except ValueError as exc:
                  bad.append(f"{path}: {exc}")
          if bad:
              print("These data files are not valid JSON:")
              print("\n".join(bad))
              sys.exit(1)
          print(f"{len(files)} data files are valid JSON.")
          PY

      - name: Upload data
        uses: actions/upload-artifact@v7
        with:
          name: data
          path: src/data/generated
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 2. Build the static site from the data we just downloaded
  # ------------------------------------------------------------------
  build:
    name: Build the site
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Restore refreshed data
        # No `continue-on-error` on purpose: without the data there is no
        # site to publish, so the old site stays up instead of a blank one.
        uses: actions/download-artifact@v8
        with:
          name: data
          path: src/data/generated

      - name: Build
        run: npm run build

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # ------------------------------------------------------------------
  # 3. Publish to GitHub Pages
  # ------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
