name: Refresh data and publish

on:
  push:
    branches: [main]
  schedule:
    # 05:00 UTC every day - job boards update overnight
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # 0. Check the code before anything is published
  # ------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scoring and data tests
        run: |
          npm test
          npm run test:data

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Browser test
        run: node tools/test-finder-browser.mjs

  # ------------------------------------------------------------------
  # 1. Pull fresh numbers from BLS, O*NET, USAJOBS and the state boards
  # ------------------------------------------------------------------
  data:
    name: Refresh the data
    # Only a scheduled or manual run needs the pipeline. A code push must
    # not spend API quota or write a new data commit.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run the data pipeline
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          BLS_CONTACT_EMAIL: ${{ secrets.BLS_CONTACT_EMAIL }}
          CAREERONESTOP_USER_ID: ${{ secrets.CAREERONESTOP_USER_ID }}
          CAREERONESTOP_TOKEN: ${{ secrets.CAREERONESTOP_TOKEN }}
        run: |
          python3 -u -m pipeline.build_data

      - name: Commit refreshed data
        # The push is best-effort: the deploy below uses the artifact, so a
        # failed push must not stop the site from updating.
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/generated || true
          if git diff --staged --quiet; then
            echo "No data changes - nothing to commit."
          else
            git commit -m "data: refresh statistics ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Upload data
        uses: actions/upload-artifact@v7
        with:
          name: data
          path: src/data/generated
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 2. Build the static site
  # ------------------------------------------------------------------
  build:
    name: Build the site
    # `always()` because the data job is skipped on a code push, and then
    # the site is built from the data already in the repository.
    needs: [data, test]
    if: always() && needs.data.result != 'failure' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Restore refreshed data
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: data
          path: src/data/generated

      - name: Build
        run: npm run build

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # ------------------------------------------------------------------
  # 3. Publish to GitHub Pages
  # ------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
